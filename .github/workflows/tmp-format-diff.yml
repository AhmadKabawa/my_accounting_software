# TEMPORARY: prints what `dart format` would change. Delete before merging.
name: tmp-format-diff
on:
  push:
    branches: ['feat/ui-step2-c41-c07-c12']
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true
      - run: dart format lib/app/core test/core/presentation/widgets lib/app/localization > /dev/null
      - run: git diff --no-color
