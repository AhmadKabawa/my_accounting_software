name: tmp-format
on:
  push:
    branches: [fix/ui-template-hardening]
permissions:
  contents: write
jobs:
  fmt:
    if: "!contains(github.event.head_commit.message, 'tmp-format-done')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true
      - run: dart format lib test
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A lib test
          git diff --cached --quiet || git commit -m "style: dart format (tmp-format-done)"
          git push
