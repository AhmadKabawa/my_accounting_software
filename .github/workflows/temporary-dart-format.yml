name: Temporary Dart formatter and focused tests

on:
  push:
    branches:
      - feat/core-date-picker
      - feat/cat07-care-instructions

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
      - name: Format Dart sources
        run: dart format lib test
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run focused feature tests
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "feat/core-date-picker" ]; then
            flutter test test/core/foundation/date/date_only_test.dart
            flutter test test/core/foundation/validation/app_validator_test.dart
            flutter test test/core/presentation/widgets/app_date_picker_field_test.dart
          else
            flutter test test/core/presentation/widgets/app_page_header_test.dart
            flutter test test/features/catalog/care_instructions
          fi
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format Dart sources"
          git push
