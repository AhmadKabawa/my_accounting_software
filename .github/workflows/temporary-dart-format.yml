name: Temporary Dart Formatter

on:
  push:
    branches:
      - feat/colors-enhancement

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/colors-enhancement
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true
      - name: Format Dart sources
        run: dart format .
      - name: Commit formatted sources
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: format Dart sources"
          git push origin HEAD:feat/colors-enhancement
