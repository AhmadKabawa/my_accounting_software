name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [vscode]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        id: dependencies
        timeout-minutes: 5
        run: flutter pub get

      - name: Temporary formatter diagnostic
        run: dart format --output=show test/features/catalog/brands/presentation/sections/brands_table_section_test.dart

      - name: Check formatting
        timeout-minutes: 5
        run: dart format --set-exit-if-changed .

      - name: Analyze
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 20
        run: flutter test

      - name: Run catalog UI widget tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          flutter test
          test/core/presentation/widgets/app_searchable_dropdown_test.dart
          test/core/presentation/widgets/app_filter_bar_test.dart
          test/core/presentation/widgets/app_data_table_test.dart
          test/core/presentation/widgets/list_page_template_test.dart
