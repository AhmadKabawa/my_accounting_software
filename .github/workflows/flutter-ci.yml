name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.1'

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Print formatter output for changed files
        run: |
          echo "BEGIN_FILE:lib/app/features/catalog/brands/data/datasources/brand_stats_remote_data_source_impl.dart"
          dart format --output=show "lib/app/features/catalog/brands/data/datasources/brand_stats_remote_data_source_impl.dart"
          echo "END_FILE:lib/app/features/catalog/brands/data/datasources/brand_stats_remote_data_source_impl.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/brands/domain/entity/brand_list_query.dart"
          dart format --output=show "lib/app/features/catalog/brands/domain/entity/brand_list_query.dart"
          echo "END_FILE:lib/app/features/catalog/brands/domain/entity/brand_list_query.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/brands/domain/entity/brand_stats.dart"
          dart format --output=show "lib/app/features/catalog/brands/domain/entity/brand_stats.dart"
          echo "END_FILE:lib/app/features/catalog/brands/domain/entity/brand_stats.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/categories/data/repositories/categories_repository_impl.dart"
          dart format --output=show "lib/app/features/catalog/categories/data/repositories/categories_repository_impl.dart"
          echo "END_FILE:lib/app/features/catalog/categories/data/repositories/categories_repository_impl.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/categories/domain/failures/category_failures.dart"
          dart format --output=show "lib/app/features/catalog/categories/domain/failures/category_failures.dart"
          echo "END_FILE:lib/app/features/catalog/categories/domain/failures/category_failures.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/colors/data/colors_endpoint.dart"
          dart format --output=show "lib/app/features/catalog/colors/data/colors_endpoint.dart"
          echo "END_FILE:lib/app/features/catalog/colors/data/colors_endpoint.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/colors/data/datasources/color_stats_remote_data_source_impl.dart"
          dart format --output=show "lib/app/features/catalog/colors/data/datasources/color_stats_remote_data_source_impl.dart"
          echo "END_FILE:lib/app/features/catalog/colors/data/datasources/color_stats_remote_data_source_impl.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/colors/data/datasources/colors_remote_data_source_impl.dart"
          dart format --output=show "lib/app/features/catalog/colors/data/datasources/colors_remote_data_source_impl.dart"
          echo "END_FILE:lib/app/features/catalog/colors/data/datasources/colors_remote_data_source_impl.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/colors/data/models/color_model.dart"
          dart format --output=show "lib/app/features/catalog/colors/data/models/color_model.dart"
          echo "END_FILE:lib/app/features/catalog/colors/data/models/color_model.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/colors/presentation/localization/colors_keys.dart"
          dart format --output=show "lib/app/features/catalog/colors/presentation/localization/colors_keys.dart"
          echo "END_FILE:lib/app/features/catalog/colors/presentation/localization/colors_keys.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/product_types/data/repositories/product_type_links_repository_impl.dart"
          dart format --output=show "lib/app/features/catalog/product_types/data/repositories/product_type_links_repository_impl.dart"
          echo "END_FILE:lib/app/features/catalog/product_types/data/repositories/product_type_links_repository_impl.dart"
          echo "BEGIN_FILE:lib/app/features/catalog/product_types/domain/failures/product_type_failures.dart"
          dart format --output=show "lib/app/features/catalog/product_types/domain/failures/product_type_failures.dart"
          echo "END_FILE:lib/app/features/catalog/product_types/domain/failures/product_type_failures.dart"
          echo "BEGIN_FILE:test/features/catalog/brands/data/datasources/brand_stats_remote_data_source_impl_test.dart"
          dart format --output=show "test/features/catalog/brands/data/datasources/brand_stats_remote_data_source_impl_test.dart"
          echo "END_FILE:test/features/catalog/brands/data/datasources/brand_stats_remote_data_source_impl_test.dart"
          echo "BEGIN_FILE:test/features/catalog/categories/support/fake_categories_remote_data_source.dart"
          dart format --output=show "test/features/catalog/categories/support/fake_categories_remote_data_source.dart"
          echo "END_FILE:test/features/catalog/categories/support/fake_categories_remote_data_source.dart"
          echo "BEGIN_FILE:test/features/catalog/colors/data/repositories/colors_repository_test.dart"
          dart format --output=show "test/features/catalog/colors/data/repositories/colors_repository_test.dart"
          echo "END_FILE:test/features/catalog/colors/data/repositories/colors_repository_test.dart"
          echo "BEGIN_FILE:test/features/catalog/colors/support/fake_colors_api_client.dart"
          dart format --output=show "test/features/catalog/colors/support/fake_colors_api_client.dart"
          echo "END_FILE:test/features/catalog/colors/support/fake_colors_api_client.dart"
          echo "BEGIN_FILE:test/features/catalog/product_types/data/product_type_links_repository_test.dart"
          dart format --output=show "test/features/catalog/product_types/data/product_type_links_repository_test.dart"
          echo "END_FILE:test/features/catalog/product_types/data/product_type_links_repository_test.dart"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  tests:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep feature-branch pushes fast. Run the complete suite for PRs,
    # main-branch updates, manual runs and the nightly safety net.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run all tests
        run: flutter test
