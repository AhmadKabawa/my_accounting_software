name: Flutter CI

on:
  push:
    branches:
      - 'merge/**'
      - 'integration/**'
      - vscode
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.1'

jobs:
  quality:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On pushes, resolve the branch after the formatting commit (if one was made).
          ref: ${{ github.event_name == 'push' && github.ref || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart files (push only)
        if: github.event_name == 'push'
        run: dart format lib test

      - name: Commit formatting changes (push only)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- lib test; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test
            git commit -m "style: apply Dart formatting [skip ci]"
            git push
          else
            echo "Dart formatting is already clean."
          fi

      - name: Verify Dart formatting (pull requests only)
        if: github.event_name == 'pull_request'
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run all tests
        run: flutter test
