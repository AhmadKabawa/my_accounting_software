name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [vscode]

permissions:
  contents: write

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Format and commit formatted sources
        run: |
          dart format .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "style: format Dart sources [skip ci]"
            git push
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Access unit tests
        continue-on-error: true
        run: timeout 90s flutter test test/core/access

      - name: Session integration tests
        continue-on-error: true
        run: timeout 90s flutter test test/features/auth/session_access_integration_test.dart

      - name: Shell integration tests
        continue-on-error: true
        run: timeout 90s flutter test test/shell/app_shell_test.dart
