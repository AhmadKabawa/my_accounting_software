name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [vscode]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        timeout-minutes: 5
        run: flutter pub get

      - name: Check formatting
        timeout-minutes: 5
        run: dart format --set-exit-if-changed .

      - name: Analyze
        timeout-minutes: 10
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        timeout-minutes: 20
        run: flutter test
