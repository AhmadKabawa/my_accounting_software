name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [vscode]

permissions:
  contents: write

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        id: dependencies
        timeout-minutes: 5
        run: flutter pub get

      - name: Check formatting
        timeout-minutes: 5
        run: dart format --set-exit-if-changed .


      - name: Commit formatter output
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/app/core/presentation/widgets/app_color_picker/app_color_picker.dart \
            lib/app/core/presentation/widgets/app_searchable_dropdown/searchable_dropdown.dart \
            test/architecture/icon_tone_test.dart \
            test/architecture/feature_imports_test.dart \
            test/core/foundation/color_name_resolver_test.dart \
            test/core/presentation/widgets/app_breadcrumb_test.dart \
            test/core/presentation/widgets/app_color_picker_test.dart \
            test/core/presentation/widgets/app_icon_tone_test.dart \
            test/core/presentation/widgets/app_searchable_dropdown_test.dart \
            test/features/catalog/brands/presentation/widgets/brands_filter_bar_test.dart \
            test/features/catalog/colors/presentation/widgets/colors_filter_bar_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: apply dart format"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Analyze
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 20
        run: flutter test

      - name: Run catalog UI widget tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        timeout-minutes: 10
        run: >-
          flutter test
          test/core/presentation/widgets/app_searchable_dropdown_test.dart
          test/core/presentation/widgets/app_filter_bar_test.dart
          test/core/presentation/widgets/app_data_table_test.dart
          test/core/presentation/widgets/list_page_template_test.dart
