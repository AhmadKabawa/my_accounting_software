name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [vscode]

permissions:
  contents: read

jobs:
  quality:
    name: Analyze and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Format and capture diff
        run: |
          dart format .
          git diff --binary > /tmp/dart-format.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: dart-format-patch
          path: /tmp/dart-format.patch

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
