name: Temporary test formatter
on:
  push:
    branches:
      - feat/ui-c46-c48-shell-templates
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.1
          channel: stable
      - name: Format test source
        run: dart format test/shell/app_shell_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: c46-formatted-test
          path: test/shell/app_shell_test.dart
