name: Temporary Dart format preview
on:
  push:
    branches:
      - feat/brands-enrichment
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.1
          channel: stable
      - name: Print formatted Dart sources
        run: |
          dart format --output=show lib/app/core/presentation/widgets/app_searchable_dropdown/searchable_dropdown.dart
          dart format --output=show lib/app/features/catalog/brands/presentation/pages/brands_screen.dart
          dart format --output=show lib/app/features/catalog/brands/presentation/widgets/brand_stats_bar.dart
          dart format --output=show lib/app/features/catalog/brands/presentation/widgets/brands_filter_bar.dart
