name: Format debug
on:
  push:
    paths: ['.github/workflows/fmt-debug.yml']
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
      - run: |
          cp test/core/presentation/widgets/app_color_swatch/app_color_swatch_test.dart /tmp/before.dart
          dart format test/core/presentation/widgets/app_color_swatch/app_color_swatch_test.dart
          diff /tmp/before.dart test/core/presentation/widgets/app_color_swatch/app_color_swatch_test.dart || true
