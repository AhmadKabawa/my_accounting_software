# TEMPORARY: per-test-file baseline for fix/foundation-green-baseline. Remove after the baseline is recorded.
name: tmp-baseline
on:
  push:
    branches: ['fix/foundation-green-baseline']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          cache: true
      - run: flutter pub get
      - name: Run each test file independently (60-second limit)
        timeout-minutes: 180
        shell: bash
        run: |
          mkdir -p /tmp/test-baseline
          failures=0
          while IFS= read -r file; do
            name="${file//\//_}"
            log="/tmp/test-baseline/${name}.log"
            echo "::group::${file}"
            timeout --signal=TERM --kill-after=10s 70s flutter test "${file}" --timeout 60s --reporter expanded >"${log}" 2>&1
            status=$?
            printf '%s\t%s\n' "$status" "$file" | tee -a /tmp/test-baseline/summary.tsv
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              echo "FAILED (exit $status): ${file}"
              tail -n 35 "$log"
            else
              echo "PASSED: ${file}"
            fi
            echo "::endgroup::"
          done < <(find test -type f -name '*_test.dart' | sort)
          echo "===== PER-FILE SUMMARY ====="
          cat /tmp/test-baseline/summary.tsv
          echo "===== TOTALS ====="
          awk -F '\t' '$1 == 0 { passed++ } $1 != 0 { failed++ } END { printf "passed=%d failed=%d\n", passed, failed }' /tmp/test-baseline/summary.tsv
          echo "===== FAILURE COUNT: ${failures} ====="
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
      - name: Upload per-file logs and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: per-file-test-baseline
          path: /tmp/test-baseline/
          if-no-files-found: error
